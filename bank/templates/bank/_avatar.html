{# A profile picture or coloured initials. Pass p=<Profile>, size="sm|md|lg", and small=True to use the 64px file. #}
{% if p.avatar_url %}<img class="avatar avatar-{{ size|default:'md' }}" src="{% if small and p.avatar_small_url %}{{ p.avatar_small_url }}{% else %}{{ p.avatar_url }}{% endif %}" alt="{{ alt|default:'' }}" width="{% if size == 'lg' %}112{% elif size == 'sm' %}30{% else %}58{% endif %}" height="{% if size == 'lg' %}112{% elif size == 'sm' %}30{% else %}58{% endif %}" loading="lazy" decoding="async">{% else %}<span class="avatar avatar-{{ size|default:'md' }} avatar-initials {{ p.avatar_color }}"{% if alt %} role="img" aria-label="{{ alt }}"{% else %} aria-hidden="true"{% endif %}>{{ p.initials }}</span>{% endif %}
